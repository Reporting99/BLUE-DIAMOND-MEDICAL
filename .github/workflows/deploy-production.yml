name: Deploy Production

run-name: "Deploy Production — ${{ inputs.release_sha || github.sha }}"

# MANUAL ONLY, DELIBERATELY.
#
# There is no `workflow_run` trigger here yet. Automatic deployment after green
# CI is the intended end state and the sibling project on this host already
# runs that way, but it is enabled only AFTER a controlled manual release has
# proven the whole path end to end on this server: artifact packaging, upload,
# script installation, slot switch, health gating, SHA verification, rollback.
#
# When enabling it later, the trigger must deploy `workflow_run.head_sha`, NOT
# `github.sha`. On a workflow_run event the deploy run's own github.sha is the
# DEFAULT BRANCH TIP, not the commit CI actually passed on -- a trap that has
# already produced a mislabelled deploy on this host.
on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Full 40-character commit SHA to deploy (must be on main and have passed CI)"
        required: true
        type: string

permissions:
  contents: read
  actions: read
  checks: read

concurrency:
  group: blue-diamond-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Production
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production

    # No build-time environment here any more, deliberately. Every
    # NEXT_PUBLIC_*/SITE_URL/FEELSTACK_* value is baked into the artifact by
    # ci.yml's `release-artifact` job; repeating them here would suggest they
    # still influence what ships, and they do not.

    steps:
      - name: Validate the requested SHA
        id: release
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail

          if [[ ! "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::release_sha must be a lowercase 40-character commit SHA."
            exit 1
          fi

          echo "release_sha=$REQUESTED_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout the requested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.release_sha }}
          # Full history: the ancestry check below needs main's history, and a
          # shallow clone cannot answer "is this commit on main?".
          fetch-depth: 0
          persist-credentials: false

      # A SHA that is not on main is a SHA nobody reviewed and merged. Without
      # this, workflow_dispatch would deploy any commit in the repository,
      # including one from an abandoned branch or an unmerged PR.
      - name: Verify the SHA is on main
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          set -euo pipefail

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$RELEASE_SHA" origin/main; then
            echo "::error::$RELEASE_SHA is not an ancestor of origin/main. Refusing to deploy."
            exit 1
          fi
          echo "$RELEASE_SHA is on main."

      # CI MUST HAVE PASSED FOR THIS EXACT COMMIT.
      #
      # Not "for the branch", not "recently" -- for this SHA. A green branch
      # with a red commit in its history is exactly the situation where a
      # manual deploy of the wrong SHA ships an untested build.
      # It also names the RUN that produced the deployable artifact. Those are
      # the same fact -- "CI proved this commit" and "these are the bytes CI
      # proved" -- and splitting them is what allowed a second, unvalidated
      # build to exist at all.
      - name: Verify CI passed for this SHA and locate its run
        id: ci
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          set -euo pipefail

          RUN_JSON="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${RELEASE_SHA}&status=completed&per_page=100" \
              --jq '[.workflow_runs[] | select(.head_sha == env.RELEASE_SHA)] | sort_by(.created_at) | last // {}'
          )"

          CONCLUSION="$(printf '%s' "$RUN_JSON" | jq -r '.conclusion // "none"')"
          RUN_ID="$(printf '%s' "$RUN_JSON" | jq -r '.id // empty')"

          echo "Latest completed CI conclusion for ${RELEASE_SHA}: ${CONCLUSION} (run ${RUN_ID:-none})"

          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::CI has not passed for ${RELEASE_SHA} (conclusion: ${CONCLUSION}). Refusing to deploy."
            exit 1
          fi
          if [[ ! "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not identify the CI run id for ${RELEASE_SHA}."
            exit 1
          fi

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      # BUILD ONCE, DEPLOY ONCE.
      #
      # This workflow no longer builds anything. It used to `npm ci` and
      # `npm run build` the same SHA that ci.yml had already built and tested --
      # a second build, in hybrid content mode, re-resolving live FeelStack
      # content, whose only distinguishing property was that nobody had ever
      # run a test against its output. A transient CMS timeout in that build
      # failed a release that CI had proven green minutes earlier.
      #
      # The artifact below is the one `release-artifact` produced from this
      # exact commit, in the same environment, after the full suite passed.
      # scripts/assert-no-app-build.sh enforces that no build command comes
      # back here (Workflow Lint), because the gap between "tested" and
      # "shipped" reopens the moment one does.
      - name: Download the CI-built release artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
          RUN_ID: ${{ steps.ci.outputs.run_id }}
        run: |
          set -euo pipefail

          DEST="${RUNNER_TEMP}/release"
          rm -rf "$DEST"
          mkdir -p "$DEST"

          # The artifact name carries the full SHA, so asking for it by name is
          # itself an identity check: a wrong-commit artifact does not answer to
          # this name and the download simply fails.
          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "release-${RELEASE_SHA}" \
            --dir "$DEST"

          ls -la "$DEST"

      - name: Verify the artifact's checksum and SHA identity
        id: package
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          set -euo pipefail

          DEST="${RUNNER_TEMP}/release"
          ARTIFACT_NAME="blue-diamond-${RELEASE_SHA}.tar.gz"
          CHECKSUM_NAME="${ARTIFACT_NAME}.sha256"
          ARTIFACT_PATH="${DEST}/${ARTIFACT_NAME}"

          # The FILENAME is part of the release identity chain
          # (docs/RELEASE_SAFETY.md): origin/main SHA == CI run SHA == artifact
          # filename SHA == .release-sha inside the tarball == deployed SHA ==
          # /api/version. Checking only "the download succeeded" would leave the
          # filename unverified after extraction.
          test -f "$ARTIFACT_PATH" || { echo "::error::${ARTIFACT_NAME} is not in the downloaded artifact."; exit 1; }
          test -f "${DEST}/${CHECKSUM_NAME}" || { echo "::error::${CHECKSUM_NAME} is missing -- CI did not publish a checksum."; exit 1; }

          # sha256sum -c, from inside the directory, because the sidecar names
          # the artifact by its bare name.
          ( cd "$DEST" && sha256sum -c "$CHECKSUM_NAME" )

          ARTIFACT_SHA256="$(sha256sum "$ARTIFACT_PATH" | awk '{print $1}')"
          RECORDED_SHA256="$(awk '{print $1}' < "${DEST}/${CHECKSUM_NAME}")"
          if [ "$ARTIFACT_SHA256" != "$RECORDED_SHA256" ]; then
            echo "::error::Artifact checksum does not match the published checksum file."
            exit 1
          fi

          # And the release identity the tarball carries must be the SHA that
          # was requested -- the same assertion the server-side script makes
          # again after extraction, made here before anything is uploaded.
          EMBEDDED_SHA="$(tar -xzOf "$ARTIFACT_PATH" ./.release-sha | tr -d '\r\n')"
          if [ "$EMBEDDED_SHA" != "$RELEASE_SHA" ]; then
            echo "::error::Artifact .release-sha is ${EMBEDDED_SHA}, expected ${RELEASE_SHA}."
            exit 1
          fi

          echo "ARTIFACT_IDENTITY_OK ${ARTIFACT_NAME} sha256=${ARTIFACT_SHA256}"
          {
            echo "artifact_path=$ARTIFACT_PATH"
            echo "artifact_name=$ARTIFACT_NAME"
            echo "artifact_sha256=$ARTIFACT_SHA256"
          } >> "$GITHUB_OUTPUT"


      # Private path to the server, so the deploy key is never presented to a
      # publicly reachable SSH surface.
      # Matches the Dfeelings deploy workflow exactly, which is the verified
      # reference architecture on this server: the same action at the same
      # major version, and the same `ping` pre-check so a tailnet that has not
      # come up yet fails HERE, with a clear message, rather than several steps
      # later as an opaque SSH timeout. The tag stays Blue Diamond's own so the
      # two projects remain separately authorized in the tailnet ACL.
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:blue-diamond-deploy
          ping: ${{ vars.DEPLOY_TAILSCALE_HOST }}

      - name: Configure secure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          test -n "$SSH_PRIVATE_KEY" || { echo "::error::DEPLOY_SSH_PRIVATE_KEY is missing."; exit 1; }
          # Pinned host key rather than ssh-keyscan: keyscan-on-every-run is
          # trust-on-first-use dressed up as automation, and a flaky network
          # dependency besides.
          test -n "$SSH_KNOWN_HOSTS" || { echo "::error::DEPLOY_KNOWN_HOSTS is missing."; exit 1; }

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" > /dev/null

          echo "SSH_CONFIGURATION_OK"

      - name: Upload release artifact and deployment script
        shell: bash
        env:
          ARTIFACT_PATH: ${{ steps.package.outputs.artifact_path }}
          ARTIFACT_NAME: ${{ steps.package.outputs.artifact_name }}
          ARTIFACT_SHA256: ${{ steps.package.outputs.artifact_sha256 }}
          DEPLOY_HOST: ${{ vars.DEPLOY_TAILSCALE_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          set -euo pipefail

          for required in ARTIFACT_PATH ARTIFACT_NAME ARTIFACT_SHA256 DEPLOY_HOST DEPLOY_PORT DEPLOY_USER; do
            if [ -z "${!required:-}" ]; then
              echo "::error::$required is missing."
              exit 1
            fi
          done

          UPLOADS="/home/deploy-blue-diamond/uploads"
          REMOTE_ARTIFACT="${UPLOADS}/${ARTIFACT_NAME}"
          REMOTE_TEMP="${REMOTE_ARTIFACT}.part-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          REMOTE_SCRIPT="${UPLOADS}/deploy-blue-diamond.candidate"
          REMOTE_SUM="${REMOTE_SCRIPT}.sha256"

          SSH_OPTIONS=(
            -i "$HOME/.ssh/id_ed25519" -p "$DEPLOY_PORT"
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=8
          )
          SCP_OPTIONS=(
            -i "$HOME/.ssh/id_ed25519" -P "$DEPLOY_PORT"
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=8
          )

          # The deployment script must come from the SAME commit as the
          # application it deploys, or the reviewed logic and the executed
          # logic can differ. Validated locally first so a broken script fails
          # with a clear message before it ever reaches the server.
          LOCAL_SCRIPT="ops/deploy/deploy-blue-diamond"
          test -s "$LOCAL_SCRIPT"
          bash -n "$LOCAL_SCRIPT"
          SCRIPT_SHA256="$(sha256sum "$LOCAL_SCRIPT" | awk '{print $1}')"

          # shellcheck disable=SC2029  # client-side expansion is intended:
          # these paths are computed HERE from the run id and artifact name, and
          # are embedded single-quoted so the remote shell treats them as
          # literals rather than re-expanding them.
          ssh "${SSH_OPTIONS[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "rm -f -- '$REMOTE_TEMP' '$REMOTE_ARTIFACT' '$REMOTE_SCRIPT' '$REMOTE_SUM'"

          scp "${SCP_OPTIONS[@]}" "$ARTIFACT_PATH" "$DEPLOY_USER@$DEPLOY_HOST:$REMOTE_TEMP"
          scp "${SCP_OPTIONS[@]}" "$LOCAL_SCRIPT" "$DEPLOY_USER@$DEPLOY_HOST:$REMOTE_SCRIPT"

          # shellcheck disable=SC2029  # same rule as above: the local values are
          # deliberately baked in, and anything that must stay remote is escaped
          # (\$ ...) so only the intended names expand on this side.
          ssh "${SSH_OPTIONS[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "
            set -euo pipefail

            test -f '$REMOTE_TEMP' && test ! -L '$REMOTE_TEMP' && test -s '$REMOTE_TEMP'
            test \"\$(sha256sum '$REMOTE_TEMP' | awk '{print \$1}')\" = '$ARTIFACT_SHA256'
            chmod 600 '$REMOTE_TEMP'
            mv -f -- '$REMOTE_TEMP' '$REMOTE_ARTIFACT'
            chmod 600 '$REMOTE_ARTIFACT'

            test -f '$REMOTE_SCRIPT' && test ! -L '$REMOTE_SCRIPT' && test -s '$REMOTE_SCRIPT'
            test \"\$(sha256sum '$REMOTE_SCRIPT' | awk '{print \$1}')\" = '$SCRIPT_SHA256'
            chmod 600 '$REMOTE_SCRIPT'
            printf '%s' '$SCRIPT_SHA256' > '$REMOTE_SUM'
            chmod 600 '$REMOTE_SUM'

            echo 'UPLOAD_VERIFIED'
          "

          echo "SCRIPT_SHA256=$SCRIPT_SHA256" >> "$GITHUB_ENV"

      # Runs immediately before the deployment so nothing can execute between
      # installing the script and using it.
      - name: Install deployment script from this commit
        shell: bash
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_TAILSCALE_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          set -euo pipefail

          OUTPUT="$(
            ssh -i "$HOME/.ssh/id_ed25519" -p "$DEPLOY_PORT" \
              -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "sudo -n /usr/local/sbin/install-blue-diamond-deploy-script"
          )"

          echo "$OUTPUT"

          # Without this assertion the job could pass while the server still
          # held an older script.
          case "$OUTPUT" in
            *"sha256=$SCRIPT_SHA256"*) echo "DEPLOY_SCRIPT_INSTALL_OK" ;;
            *)
              echo "::error::Installed deployment script does not match this commit (expected $SCRIPT_SHA256)."
              exit 1
              ;;
          esac

      - name: Deploy release
        id: deploy
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
          ARTIFACT_NAME: ${{ steps.package.outputs.artifact_name }}
          DEPLOY_HOST: ${{ vars.DEPLOY_TAILSCALE_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          set -euo pipefail

          # Run ONCE. The server-side script owns rollback on failure; a retry
          # here would re-enter a half-rolled-back state.
          #
          # The deploy's own stdout is the trusted channel for where it landed.
          # It is captured to a file rather than piped, so the deploy's real
          # exit status survives -- a pipeline would report the exit code of
          # whatever came last instead.
          DEPLOY_LOG="$RUNNER_TEMP/deploy-stdout.txt"

          set +e
          ssh -i "$HOME/.ssh/id_ed25519" -p "$DEPLOY_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=8 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo -n /usr/local/sbin/deploy-blue-diamond \
              '/home/deploy-blue-diamond/uploads/${ARTIFACT_NAME}' \
              '${RELEASE_SHA}'" > "$DEPLOY_LOG" 2>&1
          DEPLOY_STATUS=$?
          set -e

          cat "$DEPLOY_LOG"

          if [ "$DEPLOY_STATUS" -ne 0 ]; then
            echo "::error::Deployment failed (exit ${DEPLOY_STATUS}). The server-side script owns rollback."
            exit "$DEPLOY_STATUS"
          fi

          # Strict parse. Each key must appear EXACTLY once: a duplicate means
          # the script emitted contradictory answers and we must not pick one.
          scripts/parse-deploy-output.sh "$DEPLOY_LOG" "$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "DEPLOY_OUTPUT_CONTRACT_OK"

      # Independent of the server-side check, from outside the server. The
      # deploy script already asserted this and rolled back on mismatch; this
      # catches the case where the script itself is wrong.
      - name: Verify the serving slot reports this SHA
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
          DEPLOY_HOST: ${{ vars.DEPLOY_TAILSCALE_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          set -euo pipefail

          # The port comes from the deploy's own validated stdout, NOT from
          # /home/blue-diamond/deployments/active-release.env. That file is
          # deliberately root:blue-diamond 0640 and the deploy user is
          # deliberately not in the runtime group, so reading it fails with
          # "Permission denied" -- which is what turned a fully successful
          # release into a red workflow. The fix is to stop reading it, not to
          # widen its permissions or the deploy user's group membership.
          ACTIVE_PORT='${{ steps.deploy.outputs.active_port }}'
          case "$ACTIVE_PORT" in
            3030|3031) ;;
            *) echo "::error::Deploy step did not yield a valid ACTIVE_PORT."; exit 1 ;;
          esac

          RESULT="$(
            ssh -i "$HOME/.ssh/id_ed25519" -p "$DEPLOY_PORT" \
              -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              "$DEPLOY_USER@$DEPLOY_HOST" "
                set -euo pipefail
                for path in /api/version /en /ar; do
                  code=\"\$(curl -sS -o /tmp/bd-verify-body --max-time 15 --retry 5 --retry-delay 3 \
                    --retry-all-errors -w '%{http_code}' \
                    \"http://127.0.0.1:${ACTIVE_PORT}\${path}\")\"
                  echo \"STATUS \${path} \${code}\"
                  if [ \"\${path}\" = '/api/version' ]; then
                    echo \"BODY \$(tr -d '\\n' < /tmp/bd-verify-body)\"
                  fi
                done
                rm -f /tmp/bd-verify-body
              "
          )"

          echo "$RESULT"

          for path in /api/version /en /ar; do
            line="$(printf '%s\n' "$RESULT" | grep -F "STATUS ${path} " || true)"
            code="${line##* }"
            if [ "$code" != "200" ]; then
              echo "::error::${path} on port ${ACTIVE_PORT} returned ${code:-no response}, expected 200."
              exit 1
            fi
          done

          SERVED="$(printf '%s\n' "$RESULT" | grep -oE '[0-9a-f]{40}' | head -n 1)"
          echo "Expected: $RELEASE_SHA"
          echo "Served:   ${SERVED:-none}"

          if [ "$SERVED" != "$RELEASE_SHA" ]; then
            echo "::error::The serving slot does not report the deployed release."
            exit 1
          fi

          echo "SERVED_SHA_VERIFICATION_OK"

      - name: Remove SSH material
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
