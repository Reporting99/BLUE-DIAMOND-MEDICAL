name: CI

# Validation only — brief §40. This workflow never deploys; it exists to
# catch regressions before merge. Not yet pushed to a remote (brief: "do
# not push to a remote repository... unless explicitly instructed").

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # No real secrets in CI — every ImageKit/FeelStack-dependent code
          # path is designed to fail closed to local fallback content when
          # these are unset, per docs/DEPLOYMENT.md.
          NEXT_PUBLIC_SITE_URL: https://bluediamondmedical.ca

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test
        env:
          CI: true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test-results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
