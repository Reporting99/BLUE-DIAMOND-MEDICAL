# /etc/nginx/sites-enabled/blue-diamond-active-slot.conf
#
# GENERATED FILE -- DO NOT EDIT BY HAND.
# Rewritten atomically by /usr/local/sbin/deploy-blue-diamond on every switch.
#
# This single file is the ONE place Blue Diamond traffic is steered, and the one
# authority on which slot is serving. The deploy script reads it to decide where
# traffic currently goes and rewrites it to move traffic; a rollback is the same
# one-line rewrite in the opposite direction, costing a reload rather than a
# rebuild.
#
# It declares an UPSTREAM rather than a bare `proxy_pass http://127.0.0.1:PORT/;`.
# The bare form only works inside a whole-site `location /`, where its trailing
# slash is harmless; an exact-path route such as
# `location = /api/feelstack/revalidate` would have the matched URI replaced by
# "/" and the request delivered to the application root. Referenced as
# `proxy_pass http://blue_diamond_app;` the request URI survives, so one
# generated file serves every location the canonical-domain vhost defines.
#
# Lives in sites-enabled/, not snippets/: an `upstream` block is only valid at
# `http` level, and this host's nginx.conf includes sites-enabled/*.conf there
# and nothing else.
#
# BLUE : 3030      GREEN : 3031
#
# ACTIVE_SLOT=green

upstream blue_diamond_app {
    server 127.0.0.1:3031;
}
