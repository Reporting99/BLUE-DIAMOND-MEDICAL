# /etc/nginx/sites-enabled/bluediamondmedical.ca.conf
#
# The canonical Blue Diamond Medical vhost. NOT INSTALLED YET — see the
# cutover runbook in ops/nginx/README.md. Installing it before its TLS
# certificate exists would make `nginx -t` fail on a missing
# ssl_certificate file, and on this shared host that breaks the reload for
# EVERY other tenant, not just this site.
#
# It references the `blue_diamond_app` upstream declared by the generated
# blue-diamond-active-slot.conf, so a Blue/Green switch moves the site and
# its revalidation webhook together and the two can never disagree.

# ---------------------------------------------------------------- :80 ------
# Plain HTTP exists for exactly two reasons: the ACME challenge, and sending
# everything else to HTTPS. It never proxies the application.
server {
    listen 80;
    listen [::]:80;
    server_name bluediamondmedical.ca www.bluediamondmedical.ca;

    # Must stay reachable over :80 for issuance AND renewal.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://bluediamondmedical.ca$request_uri;
    }
}

# ------------------------------------------------------- :443 www -> apex ---
# A separate server block rather than an `if` inside the canonical one: the
# redirect is a property of the hostname, and nginx picks the block by
# server_name before any rewrite runs.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.bluediamondmedical.ca;

    ssl_certificate     /etc/nginx/ssl-certificates/bluediamondmedical.ca.crt;
    ssl_certificate_key /etc/nginx/ssl-certificates/bluediamondmedical.ca.key;

    return 301 https://bluediamondmedical.ca$request_uri;
}

# ------------------------------------------------------- :443 canonical -----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bluediamondmedical.ca;

    ssl_certificate     /etc/nginx/ssl-certificates/bluediamondmedical.ca.crt;
    ssl_certificate_key /etc/nginx/ssl-certificates/bluediamondmedical.ca.key;

    access_log /home/blue-diamond/logs/nginx/access.log;
    error_log  /home/blue-diamond/logs/nginx/error.log;

    # The app streams its own responses and sets its own cache headers.
    # 20m covers a large media upload through the CMS webhook path; the
    # application itself accepts nothing near that on a page request.
    client_max_body_size 20m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml application/manifest+json;

    # Safe on any origin and cheap to get right. Deliberately NO
    # Content-Security-Policy here: this site loads ImageKit imagery, an
    # external booking destination (Skip the Waiting Room / Mikata /
    # Euclid) and schema.org markup, and a CSP written blind at the proxy
    # is the classic way to silently break all three. A CSP belongs in the
    # application, where the allowed origins are known and testable.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # HSTS stays OFF until the site has served correctly over HTTPS. Sending
    # it during a broken first launch pins that breakage into every visitor's
    # browser for max-age, and it cannot be taken back.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Next.js content-hashed assets need no rule here. Next already sends
    # `Cache-Control: public, max-age=31536000, immutable` for /_next/static,
    # and adding our own emitted the header TWICE (verified against the running
    # app). Two identical Cache-Control headers are not a hard error, but they
    # are two authorities on one policy, and the framework's is the correct
    # one — it knows which assets are content-hashed and this proxy does not.
    # The general `location /` below carries these requests.

    # FeelStack's cache-invalidation webhook. An EXACT location, and the
    # upstream form of proxy_pass — `proxy_pass http://127.0.0.1:PORT/;`
    # would replace the matched URI with "/" and deliver the webhook to the
    # application root.
    location = /api/feelstack/revalidate {
        proxy_pass http://blue_diamond_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    location / {
        proxy_pass http://blue_diamond_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        proxy_buffer_size     16k;
        proxy_buffers         8 16k;
    }
}
