# /etc/nginx/sites-enabled/bd-hooks.dfeelings.com.conf
#
# Webhook-only ingress for Blue Diamond.
#
# Blue Diamond is pre-launch and must not be reachable from the internet. It
# also needs FeelStack to be able to reach ONE route, or its cache invalidation
# never fires -- which is exactly the state that left 1301 events recorded as
# delivered with nothing registered to receive them.
#
# This vhost resolves that tension by exposing a single route on a hostname that
# serves nothing else. It is deliberately NOT the canonical domain: no page, no
# asset, no sitemap and no other API route is reachable here, so publishing this
# hostname cannot make the unlaunched site crawlable.
#
# The upstream comes from the generated active-slot snippet, so a Blue/Green
# switch moves the webhook with the site and the two can never disagree.

limit_req_zone $binary_remote_addr zone=bd_hooks:1m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name bd-hooks.dfeelings.com;

    # ACME HTTP-01 validation must work on port 80 for renewals.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bd-hooks.dfeelings.com;

    ssl_certificate     /etc/nginx/ssl-certificates/bd-hooks.dfeelings.com.crt;
    ssl_certificate_key /etc/nginx/ssl-certificates/bd-hooks.dfeelings.com.key;

    access_log /var/log/nginx/bd-hooks.access.log;
    error_log  /var/log/nginx/bd-hooks.error.log;

    # Nothing here is for humans or crawlers.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # A revalidation envelope is a few hundred bytes. Anything approaching this
    # is not a webhook, and refusing it early keeps a large body from ever
    # reaching the application.
    client_max_body_size 64k;
    client_body_buffer_size 64k;

    # The ONLY route this hostname serves.
    location = /api/feelstack/revalidate {
        # GET, HEAD, PUT, DELETE and the rest are refused by Nginx before the
        # application is involved. HMAC verification still runs in the handler;
        # this narrows the surface, it does not replace authentication.
        limit_except POST {
            deny all;
        }

        # Bursty publishing is normal -- a bulk correction emits one event per
        # entity -- so the burst allowance is real, but bounded.
        limit_req zone=bd_hooks burst=20 nodelay;
        limit_req_status 429;

        # Written atomically by the deploy script; the single authority on which
        # slot serves. No trailing slash: the request URI must reach the
        # application unchanged.
        proxy_pass http://blue_diamond_app;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The handler verifies a signature over the body; it must not be given
        # a body Nginx has begun forwarding before it is complete.
        proxy_request_buffering on;
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
    }

    # Everything else -- the site, its assets, every other API route, and any
    # probe for them -- is indistinguishable from a path that does not exist.
    location / {
        return 404;
    }
}
