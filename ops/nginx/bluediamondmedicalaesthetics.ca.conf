# /etc/nginx/sites-enabled/bluediamondmedicalaesthetics.ca.conf
#
# The legacy aesthetics domain. It serves NOTHING: every request is a
# permanent redirect to the canonical host. NOT INSTALLED YET — same
# certificate precondition as the canonical vhost.
#
# WHY HOST-ONLY, PATH PRESERVED.
# The application already owns the legacy path map
# (src/lib/routing/legacy-redirects.ts, applied in src/proxy.ts), and it
# already carries this domain's own paths — /treatments, /laser-hair-removal,
# /rf-micro-needeling, /prp-therapy and the rest are entries in that table,
# added precisely because "this app's own domain cannot catch them".
#
# So nginx changes the HOST and keeps the path; the application then makes
# the single, already-tested path decision. Duplicating the map here would
# give two copies to keep in step, and the copy in nginx would be the one
# nobody remembers to update. The cost is one extra hop on legacy paths
# (aesthetics host -> canonical host -> final route); a modern path redirects
# once. That is bounded and correct, and there is no loop: the second hop is
# a different hostname served by a different vhost.

server {
    listen 80;
    listen [::]:80;
    server_name bluediamondmedicalaesthetics.ca www.bluediamondmedicalaesthetics.ca;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://bluediamondmedical.ca$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bluediamondmedicalaesthetics.ca www.bluediamondmedicalaesthetics.ca;

    # The certificate exists only so the redirect itself can be reached over
    # HTTPS. A visitor arriving at https://<legacy>/ with no valid cert sees
    # a browser interstitial, not the redirect — so the old domain still
    # needs TLS even though it serves no content.
    ssl_certificate     /etc/nginx/ssl-certificates/bluediamondmedicalaesthetics.ca.crt;
    ssl_certificate_key /etc/nginx/ssl-certificates/bluediamondmedicalaesthetics.ca.key;

    return 301 https://bluediamondmedical.ca$request_uri;
}
