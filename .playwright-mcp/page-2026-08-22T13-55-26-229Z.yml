          - listitem [ref=f3e182]:
            - generic [ref=f3e185]: Treatments
      - heading "Treatments" [level=1] [ref=f3e186]
      - paragraph [ref=f3e187]: Every treatment starts with a 20-minute consultation with a physician, who listens to your concerns and prescribes a treatment plan that meets your goals.
      - generic [ref=f3e188]:
        - link [ref=f3e189] [cursor=pointer]:
          - /url: /en/aesthetics/treatments/laser-hair-removal
          - generic [ref=f3e190]:
            - heading "Laser Hair Removal" [level=2] [ref=f3e191]
            - paragraph [ref=f3e192]: Long-lasting hair reduction anywhere on the body using the Cynosure Elite+™ laser system.
        - link [ref=f3e193] [cursor=pointer]:
          - /url: /en/aesthetics/treatments/laser-skin-treatments
          - generic [ref=f3e194]:
            - heading "Laser Skin Treatments" [level=2] [ref=f3e195]
            - paragraph [ref=f3e196]: State-of-the-art laser equipment for smoother complexions, brightening damaged skin, removing benign pigmented lesions, and treating face and leg veins.
        - link [ref=f3e197] [cursor=pointer]:
          - /url: /en/aesthetics/treatments/radio-frequency
          - generic [ref=f3e198]:
            - heading "Radio Frequency" [level=2] [ref=f3e199]
            - paragraph [ref=f3e200]: Non-invasive tightening and smoothing of skin all over the body using RF waves (TempSure), improving tone and reducing the appearance of fine lines and wrinkles.
        - link [ref=f3e201] [cursor=pointer]:
          - /url: /en/aesthetics/treatments/rf-microneedling
          - generic [ref=f3e202]:
            - heading "RF Micro-Needling" [level=2] [ref=f3e203]
            - paragraph [ref=f3e204]: The Potenza RF microneedling system adds radiofrequency energy to mechanical microneedling for enhanced skin tightening alongside the benefits of micro-injury stimulation.
        - link [ref=f3e205] [cursor=pointer]:
          - /url: /en/aesthetics/treatments/ultra
          - generic [ref=f3e206]:
            - heading "Ultra Treatment" [level=2] [ref=f3e207]
            - paragraph [ref=f3e208]: A low-downtime laser that rejuvenates the skin, giving it a brighter tone and improved texture — treating mild to moderate age spots, freckles, sun spots, pigmented lesions, sun damage, actinic keratosis, melasma, and postinflammatory hyperpigmentation.
        - link [ref=f3e209] [cursor=pointer]:
          - /url: /en/aesthetics/treatments/prp-hair-restoration
          - generic [ref=f3e210]:
            - heading "PRP Hair Restoration" [level=2] [ref=f3e211]
            - paragraph [ref=f3e212]: Platelet-Rich Plasma injected into the scalp to stimulate inactive hair follicles and promote denser, fuller hair growth — performed by Dr. Farhat.
        - link [ref=f3e213] [cursor=pointer]:
          - /url: /en/aesthetics/treatments/prp-skin-rejuvenation
          - generic [ref=f3e214]:
            - heading "PRP Skin Rejuvenation" [level=2] [ref=f3e215]
            - paragraph [ref=f3e216]: PRP used topically or via microinjections to smooth fine lines and wrinkles, improve tone and elasticity, and reduce acne scars and pigmentation — often called the "vampire facial."
        - link [ref=f3e217] [cursor=pointer]:
          - /url: /en/aesthetics/treatments/tempsure-vitalia
          - generic [ref=f3e218]:
            - heading "TempSure Vitalia" [level=2] [ref=f3e219]
            - paragraph [ref=f3e220]: Equipment addressing many pelvic floor issues and sexual health concerns that women experience at all ages and stages of life — roughly 1 in 3 women, often in silence.
