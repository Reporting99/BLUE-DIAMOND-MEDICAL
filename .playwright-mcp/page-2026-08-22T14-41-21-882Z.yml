    - generic [ref=f21e348]:
      - paragraph [ref=f21e349]: By concern
      - heading "Explore information and treatment options" [level=2] [ref=f21e350]
      - paragraph [ref=f21e351]: Browse by what you're noticing, and see the approved treatments and technologies that may be relevant — a starting point for your consultation, not a diagnosis.
      - generic [ref=f21e352]:
        - generic [ref=f21e353]:
          - figure [ref=f21e354]:
            - img "Acne Scars — Blue Diamond Medical Aesthetics" [ref=f21e355]
          - generic [ref=f21e360]:
            - paragraph [ref=f21e361]: Acne Scars
            - paragraph [ref=f21e362]: Comprehensive care for acne scarring — medical consultations, prescriptions where necessary, and RF micro-needling and laser treatments to reduce scarring, under the supervision of one of our physicians.
        - list [ref=f21e363]:
          - listitem [ref=f21e364]:
            - link [ref=f21e365] [cursor=pointer]:
              - /url: /en/aesthetics/concerns/acne-scars
              - generic [ref=f21e366]:
                - heading "Acne Scars" [level=3] [ref=f21e367]
                - paragraph [ref=f21e368]: Comprehensive care for acne scarring — medical consultations, prescriptions where necessary, and RF micro-needling and laser treatments to reduce scarring, under the supervision of one of our physicians.
          - listitem [ref=f21e372]:
            - link [ref=f21e373] [cursor=pointer]:
              - /url: /en/aesthetics/concerns/rosacea-redness
              - generic [ref=f21e374]:
                - heading "Rosacea & Redness" [level=3] [ref=f21e375]
                - paragraph [ref=f21e376]: The gentle flush of rosacea can escalate into redness that's distressing to live with. We take a holistic approach, starting with a full medical consultation to discuss what can be achieved — laser treatments often work best for this condition.
          - listitem [ref=f21e380]:
            - link [ref=f21e381] [cursor=pointer]:
              - /url: /en/aesthetics/concerns/dry-skin
              - generic [ref=f21e382]:
                - heading "Dry Skin" [level=3] [ref=f21e383]
                - paragraph [ref=f21e384]: Calgary's climate is unusually harsh on skin. Using RF micro-needling to infuse topicals — including moisturizers and pigment regulators — we help skin stay nourished and glowing for months after treatment.
          - listitem [ref=f21e388]:
            - link [ref=f21e389] [cursor=pointer]:
              - /url: /en/aesthetics/concerns/fine-lines-wrinkles
              - generic [ref=f21e390]:
                - heading "Fine Lines & Wrinkles" [level=3] [ref=f21e391]
                - paragraph [ref=f21e392]: State-of-the-art technologies to smooth and erase fine lines and wrinkles, alongside skin-tightening options for all skin types — bespoke treatments as individual as you are.
          - listitem [ref=f21e396]:
            - link [ref=f21e397] [cursor=pointer]:
              - /url: /en/aesthetics/concerns/skin-laxity
              - generic [ref=f21e398]:
                - heading "Skin Laxity" [level=3] [ref=f21e399]
                - paragraph [ref=f21e400]: Radio-frequency waves promote collagen and elastin production to tighten and smooth skin all over the body — a quick, pain-free treatment (about 15 minutes) with easy, visible results and no downtime.
          - listitem [ref=f21e404]:
            - link [ref=f21e405] [cursor=pointer]:
              - /url: /en/aesthetics/concerns/spider-veins
              - generic [ref=f21e406]:
                - heading "Spider Veins" [level=3] [ref=f21e407]
                - paragraph [ref=f21e408]: Damaged blood vessels under the skin that can appear red, blue, or purple — generally harmless but unsightly. Laser treatments can remove them from anywhere on the body quickly and painlessly.
          - listitem [ref=f21e412]:
            - link [ref=f21e413] [cursor=pointer]:
              - /url: /en/aesthetics/concerns/sun-damage-pigmentation
              - generic [ref=f21e414]:
                - heading "Sun Damage & Pigmentation" [level=3] [ref=f21e415]
                - paragraph [ref=f21e416]: Sun spots and liver spots from time in the sun can be easily reduced using our state-of-the-art laser technologies.
          - listitem [ref=f21e420]:
            - link [ref=f21e421] [cursor=pointer]:
              - /url: /en/aesthetics/concerns/skin-revitalization
              - generic [ref=f21e422]:
                - heading "Skin Revitalization" [level=3] [ref=f21e423]
                - paragraph [ref=f21e424]: Harsh weather and daily stresses can leave skin looking tired. We can refresh skin in under 45 minutes, exposing a natural glow and reducing the appearance of fine lines and wrinkles.
          - listitem [ref=f21e428]:
            - link [ref=f21e429] [cursor=pointer]:
              - /url: /en/aesthetics/concerns/razor-bumps
              - generic [ref=f21e430]:
                - heading "Razor Bumps" [level=3] [ref=f21e431]
                - paragraph [ref=f21e432]: Uncomfortable and prone to infection when combined with ingrown hairs. Our technologies can remove razor bumps, treat the underlying cause, and give you smoother, softer skin with minimally invasive treatment.
      - link "View all concerns" [ref=f21e436] [cursor=pointer]:
