    - generic [ref=f22e348]:
      - paragraph [ref=f22e349]: By concern
      - heading [level=2] [ref=f22e909]: Explore information and treatment options
      - paragraph [ref=f22e351]: Browse by what you're noticing, and see the approved treatments and technologies that may be relevant — a starting point for your consultation, not a diagnosis.
      - generic [ref=f22e352]:
        - generic [ref=f22e353]:
          - figure [ref=f22e354]
          - generic [ref=f22e360]:
            - paragraph [ref=f22e361]: Acne Scars
            - paragraph [ref=f22e362]: Comprehensive care for acne scarring — medical consultations, prescriptions where necessary, and RF micro-needling and laser treatments to reduce scarring, under the supervision of one of our physicians.
        - list [ref=f22e363]:
          - listitem [ref=f22e364]:
            - link [ref=f22e911] [cursor=pointer]:
              - /url: /en/aesthetics/concerns/acne-scars
              - generic [ref=f22e366]:
                - heading [level=3] [ref=f22e912]: Acne Scars
                - paragraph [ref=f22e368]: Comprehensive care for acne scarring — medical consultations, prescriptions where necessary, and RF micro-needling and laser treatments to reduce scarring, under the supervision of one of our physicians.
          - listitem [ref=f22e372]:
            - link [ref=f22e913] [cursor=pointer]:
              - /url: /en/aesthetics/concerns/rosacea-redness
              - generic [ref=f22e374]:
                - heading [level=3] [ref=f22e914]: Rosacea & Redness
                - paragraph [ref=f22e376]: The gentle flush of rosacea can escalate into redness that's distressing to live with. We take a holistic approach, starting with a full medical consultation to discuss what can be achieved — laser treatments often work best for this condition.
          - listitem [ref=f22e380]:
            - link [ref=f22e915] [cursor=pointer]:
              - /url: /en/aesthetics/concerns/dry-skin
              - generic [ref=f22e382]:
                - heading [level=3] [ref=f22e916]: Dry Skin
                - paragraph [ref=f22e384]: Calgary's climate is unusually harsh on skin. Using RF micro-needling to infuse topicals — including moisturizers and pigment regulators — we help skin stay nourished and glowing for months after treatment.
          - listitem [ref=f22e388]:
            - link [ref=f22e917] [cursor=pointer]:
              - /url: /en/aesthetics/concerns/fine-lines-wrinkles
              - generic [ref=f22e390]:
                - heading [level=3] [ref=f22e918]: Fine Lines & Wrinkles
                - paragraph [ref=f22e392]: State-of-the-art technologies to smooth and erase fine lines and wrinkles, alongside skin-tightening options for all skin types — bespoke treatments as individual as you are.
          - listitem [ref=f22e396]:
            - link [ref=f22e919] [cursor=pointer]:
              - /url: /en/aesthetics/concerns/skin-laxity
              - generic [ref=f22e398]:
                - heading [level=3] [ref=f22e920]: Skin Laxity
                - paragraph [ref=f22e400]: Radio-frequency waves promote collagen and elastin production to tighten and smooth skin all over the body — a quick, pain-free treatment (about 15 minutes) with easy, visible results and no downtime.
          - listitem [ref=f22e404]:
            - link [ref=f22e921] [cursor=pointer]:
              - /url: /en/aesthetics/concerns/spider-veins
              - generic [ref=f22e406]:
                - heading [level=3] [ref=f22e922]: Spider Veins
                - paragraph [ref=f22e408]: Damaged blood vessels under the skin that can appear red, blue, or purple — generally harmless but unsightly. Laser treatments can remove them from anywhere on the body quickly and painlessly.
          - listitem [ref=f22e412]:
            - link [ref=f22e923] [cursor=pointer]:
              - /url: /en/aesthetics/concerns/sun-damage-pigmentation
              - generic [ref=f22e414]:
                - heading [level=3] [ref=f22e924]: Sun Damage & Pigmentation
                - paragraph [ref=f22e416]: Sun spots and liver spots from time in the sun can be easily reduced using our state-of-the-art laser technologies.
          - listitem [ref=f22e420]:
            - link [ref=f22e925] [cursor=pointer]:
              - /url: /en/aesthetics/concerns/skin-revitalization
              - generic [ref=f22e422]:
                - heading [level=3] [ref=f22e926]: Skin Revitalization
                - paragraph [ref=f22e424]: Harsh weather and daily stresses can leave skin looking tired. We can refresh skin in under 45 minutes, exposing a natural glow and reducing the appearance of fine lines and wrinkles.
          - listitem [ref=f22e428]:
            - link [ref=f22e927] [cursor=pointer]:
              - /url: /en/aesthetics/concerns/razor-bumps
              - generic [ref=f22e430]:
                - heading [level=3] [ref=f22e928]: Razor Bumps
                - paragraph [ref=f22e432]: Uncomfortable and prone to infection when combined with ingrown hairs. Our technologies can remove razor bumps, treat the underlying cause, and give you smoother, softer skin with minimally invasive treatment.
      - link [ref=f22e929] [cursor=pointer]:
        - /url: /en/aesthetics/concerns
        - text: View all concerns
