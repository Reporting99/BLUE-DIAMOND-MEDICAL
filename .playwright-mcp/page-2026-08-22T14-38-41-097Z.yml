    - generic [ref=f20e348]:
      - paragraph [ref=f20e349]: By concern
      - heading "Explore information and treatment options" [level=2] [ref=f20e350]
      - paragraph [ref=f20e351]: Browse by what you're noticing, and see the approved treatments and technologies that may be relevant — a starting point for your consultation, not a diagnosis.
      - generic [ref=f20e352]:
        - generic [ref=f20e353]:
          - figure [ref=f20e354]:
            - img "Acne Scars — Blue Diamond Medical Aesthetics" [ref=f20e355]
          - generic [ref=f20e360]:
            - paragraph [ref=f20e361]: Acne Scars
            - paragraph [ref=f20e362]: Comprehensive care for acne scarring — medical consultations, prescriptions where necessary, and RF micro-needling and laser treatments to reduce scarring, under the supervision of one of our physicians.
        - list [ref=f20e363]:
          - listitem [ref=f20e364]:
            - link [ref=f20e365] [cursor=pointer]:
              - /url: /en/aesthetics/concerns/acne-scars
              - generic [ref=f20e366]:
                - heading "Acne Scars" [level=3] [ref=f20e367]
                - paragraph [ref=f20e368]: Comprehensive care for acne scarring — medical consultations, prescriptions where necessary, and RF micro-needling and laser treatments to reduce scarring, under the supervision of one of our physicians.
          - listitem [ref=f20e372]:
            - link [ref=f20e373] [cursor=pointer]:
              - /url: /en/aesthetics/concerns/rosacea-redness
              - generic [ref=f20e374]:
                - heading "Rosacea & Redness" [level=3] [ref=f20e375]
                - paragraph [ref=f20e376]: The gentle flush of rosacea can escalate into redness that's distressing to live with. We take a holistic approach, starting with a full medical consultation to discuss what can be achieved — laser treatments often work best for this condition.
          - listitem [ref=f20e380]:
            - link [ref=f20e381] [cursor=pointer]:
              - /url: /en/aesthetics/concerns/dry-skin
              - generic [ref=f20e382]:
                - heading "Dry Skin" [level=3] [ref=f20e383]
                - paragraph [ref=f20e384]: Calgary's climate is unusually harsh on skin. Using RF micro-needling to infuse topicals — including moisturizers and pigment regulators — we help skin stay nourished and glowing for months after treatment.
          - listitem [ref=f20e388]:
            - link [ref=f20e389] [cursor=pointer]:
              - /url: /en/aesthetics/concerns/fine-lines-wrinkles
              - generic [ref=f20e390]:
                - heading "Fine Lines & Wrinkles" [level=3] [ref=f20e391]
                - paragraph [ref=f20e392]: State-of-the-art technologies to smooth and erase fine lines and wrinkles, alongside skin-tightening options for all skin types — bespoke treatments as individual as you are.
          - listitem [ref=f20e396]:
            - link [ref=f20e397] [cursor=pointer]:
              - /url: /en/aesthetics/concerns/skin-laxity
              - generic [ref=f20e398]:
                - heading "Skin Laxity" [level=3] [ref=f20e399]
                - paragraph [ref=f20e400]: Radio-frequency waves promote collagen and elastin production to tighten and smooth skin all over the body — a quick, pain-free treatment (about 15 minutes) with easy, visible results and no downtime.
          - listitem [ref=f20e404]:
            - link [ref=f20e405] [cursor=pointer]:
              - /url: /en/aesthetics/concerns/spider-veins
              - generic [ref=f20e406]:
                - heading "Spider Veins" [level=3] [ref=f20e407]
                - paragraph [ref=f20e408]: Damaged blood vessels under the skin that can appear red, blue, or purple — generally harmless but unsightly. Laser treatments can remove them from anywhere on the body quickly and painlessly.
          - listitem [ref=f20e412]:
            - link [ref=f20e413] [cursor=pointer]:
              - /url: /en/aesthetics/concerns/sun-damage-pigmentation
              - generic [ref=f20e414]:
                - heading "Sun Damage & Pigmentation" [level=3] [ref=f20e415]
                - paragraph [ref=f20e416]: Sun spots and liver spots from time in the sun can be easily reduced using our state-of-the-art laser technologies.
          - listitem [ref=f20e420]:
            - link [ref=f20e421] [cursor=pointer]:
              - /url: /en/aesthetics/concerns/skin-revitalization
              - generic [ref=f20e422]:
                - heading "Skin Revitalization" [level=3] [ref=f20e423]
                - paragraph [ref=f20e424]: Harsh weather and daily stresses can leave skin looking tired. We can refresh skin in under 45 minutes, exposing a natural glow and reducing the appearance of fine lines and wrinkles.
          - listitem [ref=f20e428]:
            - link [ref=f20e429] [cursor=pointer]:
              - /url: /en/aesthetics/concerns/razor-bumps
              - generic [ref=f20e430]:
                - heading "Razor Bumps" [level=3] [ref=f20e431]
                - paragraph [ref=f20e432]: Uncomfortable and prone to infection when combined with ingrown hairs. Our technologies can remove razor bumps, treat the underlying cause, and give you smoother, softer skin with minimally invasive treatment.
      - link "View all concerns" [ref=f20e436] [cursor=pointer]:
