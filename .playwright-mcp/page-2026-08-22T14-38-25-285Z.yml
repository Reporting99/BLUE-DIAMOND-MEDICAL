    - generic [ref=f19e348]:
      - paragraph [ref=f19e349]: By concern
      - heading "Explore information and treatment options" [level=2] [ref=f19e350]
      - paragraph [ref=f19e351]: Browse by what you're noticing, and see the approved treatments and technologies that may be relevant — a starting point for your consultation, not a diagnosis.
      - generic [ref=f19e352]:
        - generic [ref=f19e353]:
          - figure [ref=f19e354]:
            - img "Acne Scars — Blue Diamond Medical Aesthetics" [ref=f19e355]
          - generic [ref=f19e360]:
            - paragraph [ref=f19e361]: Acne Scars
            - paragraph [ref=f19e362]: Comprehensive care for acne scarring — medical consultations, prescriptions where necessary, and RF micro-needling and laser treatments to reduce scarring, under the supervision of one of our physicians.
        - list [ref=f19e363]:
          - listitem [ref=f19e364]:
            - link [ref=f19e365] [cursor=pointer]:
              - /url: /en/aesthetics/concerns/acne-scars
              - generic [ref=f19e366]:
                - heading "Acne Scars" [level=3] [ref=f19e367]
                - paragraph [ref=f19e368]: Comprehensive care for acne scarring — medical consultations, prescriptions where necessary, and RF micro-needling and laser treatments to reduce scarring, under the supervision of one of our physicians.
          - listitem [ref=f19e372]:
            - link [ref=f19e373] [cursor=pointer]:
              - /url: /en/aesthetics/concerns/rosacea-redness
              - generic [ref=f19e374]:
                - heading "Rosacea & Redness" [level=3] [ref=f19e375]
                - paragraph [ref=f19e376]: The gentle flush of rosacea can escalate into redness that's distressing to live with. We take a holistic approach, starting with a full medical consultation to discuss what can be achieved — laser treatments often work best for this condition.
          - listitem [ref=f19e380]:
            - link [ref=f19e381] [cursor=pointer]:
              - /url: /en/aesthetics/concerns/dry-skin
              - generic [ref=f19e382]:
                - heading "Dry Skin" [level=3] [ref=f19e383]
                - paragraph [ref=f19e384]: Calgary's climate is unusually harsh on skin. Using RF micro-needling to infuse topicals — including moisturizers and pigment regulators — we help skin stay nourished and glowing for months after treatment.
          - listitem [ref=f19e388]:
            - link [ref=f19e389] [cursor=pointer]:
              - /url: /en/aesthetics/concerns/fine-lines-wrinkles
              - generic [ref=f19e390]:
                - heading "Fine Lines & Wrinkles" [level=3] [ref=f19e391]
                - paragraph [ref=f19e392]: State-of-the-art technologies to smooth and erase fine lines and wrinkles, alongside skin-tightening options for all skin types — bespoke treatments as individual as you are.
          - listitem [ref=f19e396]:
            - link [ref=f19e397] [cursor=pointer]:
              - /url: /en/aesthetics/concerns/skin-laxity
              - generic [ref=f19e398]:
                - heading "Skin Laxity" [level=3] [ref=f19e399]
                - paragraph [ref=f19e400]: Radio-frequency waves promote collagen and elastin production to tighten and smooth skin all over the body — a quick, pain-free treatment (about 15 minutes) with easy, visible results and no downtime.
          - listitem [ref=f19e404]:
            - link [ref=f19e405] [cursor=pointer]:
              - /url: /en/aesthetics/concerns/spider-veins
              - generic [ref=f19e406]:
                - heading "Spider Veins" [level=3] [ref=f19e407]
                - paragraph [ref=f19e408]: Damaged blood vessels under the skin that can appear red, blue, or purple — generally harmless but unsightly. Laser treatments can remove them from anywhere on the body quickly and painlessly.
          - listitem [ref=f19e412]:
            - link [ref=f19e413] [cursor=pointer]:
              - /url: /en/aesthetics/concerns/sun-damage-pigmentation
              - generic [ref=f19e414]:
                - heading "Sun Damage & Pigmentation" [level=3] [ref=f19e415]
                - paragraph [ref=f19e416]: Sun spots and liver spots from time in the sun can be easily reduced using our state-of-the-art laser technologies.
          - listitem [ref=f19e420]:
            - link [ref=f19e421] [cursor=pointer]:
              - /url: /en/aesthetics/concerns/skin-revitalization
              - generic [ref=f19e422]:
                - heading "Skin Revitalization" [level=3] [ref=f19e423]
                - paragraph [ref=f19e424]: Harsh weather and daily stresses can leave skin looking tired. We can refresh skin in under 45 minutes, exposing a natural glow and reducing the appearance of fine lines and wrinkles.
          - listitem [ref=f19e428]:
            - link [ref=f19e429] [cursor=pointer]:
              - /url: /en/aesthetics/concerns/razor-bumps
              - generic [ref=f19e430]:
                - heading "Razor Bumps" [level=3] [ref=f19e431]
                - paragraph [ref=f19e432]: Uncomfortable and prone to infection when combined with ingrown hairs. Our technologies can remove razor bumps, treat the underlying cause, and give you smoother, softer skin with minimally invasive treatment.
      - link "View all concerns" [ref=f19e436] [cursor=pointer]:
