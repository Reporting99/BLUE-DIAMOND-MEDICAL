          - listitem [ref=f1e183]:
            - generic [ref=f1e186]: Treatments
      - heading "Treatments" [level=1] [ref=f1e187]
      - paragraph [ref=f1e188]: Every treatment starts with a 20-minute consultation with a physician, who listens to your concerns and prescribes a treatment plan that meets your goals.
      - generic [ref=f1e189]:
        - link [ref=f1e190] [cursor=pointer]:
          - /url: /en/aesthetics/treatments/laser-hair-removal
          - generic [ref=f1e191]:
            - heading "Laser Hair Removal" [level=2] [ref=f1e192]
            - paragraph [ref=f1e193]: Long-lasting hair reduction anywhere on the body using the Cynosure Elite+™ laser system.
        - link [ref=f1e194] [cursor=pointer]:
          - /url: /en/aesthetics/treatments/laser-skin-treatments
          - generic [ref=f1e195]:
            - heading "Laser Skin Treatments" [level=2] [ref=f1e196]
            - paragraph [ref=f1e197]: State-of-the-art laser equipment for smoother complexions, brightening damaged skin, removing benign pigmented lesions, and treating face and leg veins.
        - link [ref=f1e198] [cursor=pointer]:
          - /url: /en/aesthetics/treatments/radio-frequency
          - generic [ref=f1e199]:
            - heading "Radio Frequency" [level=2] [ref=f1e200]
            - paragraph [ref=f1e201]: Non-invasive tightening and smoothing of skin all over the body using RF waves (TempSure), improving tone and reducing the appearance of fine lines and wrinkles.
        - link [ref=f1e202] [cursor=pointer]:
          - /url: /en/aesthetics/treatments/rf-microneedling
          - generic [ref=f1e203]:
            - heading "RF Micro-Needling" [level=2] [ref=f1e204]
            - paragraph [ref=f1e205]: The Potenza RF microneedling system adds radiofrequency energy to mechanical microneedling for enhanced skin tightening alongside the benefits of micro-injury stimulation.
        - link [ref=f1e206] [cursor=pointer]:
          - /url: /en/aesthetics/treatments/ultra
          - generic [ref=f1e207]:
            - heading "Ultra Treatment" [level=2] [ref=f1e208]
            - paragraph [ref=f1e209]: A low-downtime laser that rejuvenates the skin, giving it a brighter tone and improved texture — treating mild to moderate age spots, freckles, sun spots, pigmented lesions, sun damage, actinic keratosis, melasma, and postinflammatory hyperpigmentation.
        - link [ref=f1e210] [cursor=pointer]:
          - /url: /en/aesthetics/treatments/prp-hair-restoration
          - generic [ref=f1e211]:
            - heading "PRP Hair Restoration" [level=2] [ref=f1e212]
            - paragraph [ref=f1e213]: Platelet-Rich Plasma injected into the scalp to stimulate inactive hair follicles and promote denser, fuller hair growth — performed by Dr. Farhat.
        - link [ref=f1e214] [cursor=pointer]:
          - /url: /en/aesthetics/treatments/prp-skin-rejuvenation
          - generic [ref=f1e215]:
            - heading "PRP Skin Rejuvenation" [level=2] [ref=f1e216]
            - paragraph [ref=f1e217]: PRP used topically or via microinjections to smooth fine lines and wrinkles, improve tone and elasticity, and reduce acne scars and pigmentation — often called the "vampire facial."
        - link [ref=f1e218] [cursor=pointer]:
          - /url: /en/aesthetics/treatments/tempsure-vitalia
          - generic [ref=f1e219]:
            - heading "TempSure Vitalia" [level=2] [ref=f1e220]
            - paragraph [ref=f1e221]: Equipment addressing many pelvic floor issues and sexual health concerns that women experience at all ages and stages of life — roughly 1 in 3 women, often in silence.
