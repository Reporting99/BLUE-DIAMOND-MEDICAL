      - paragraph [ref=f16e376]: By concern
      - heading "Explore information and treatment options" [level=2] [ref=f16e377]
      - paragraph [ref=f16e378]: Browse by what you're noticing, and see the approved treatments and technologies that may be relevant — a starting point for your consultation, not a diagnosis.
      - generic [ref=f16e379]:
        - generic [ref=f16e380]:
          - figure [ref=f16e381]:
            - img "Acne Scars — Blue Diamond Medical Aesthetics" [ref=f16e382]
          - generic [ref=f16e387]:
            - paragraph [ref=f16e388]: Acne Scars
            - paragraph [ref=f16e389]: Comprehensive care for acne scarring — medical consultations, prescriptions where necessary, and RF micro-needling and laser treatments to reduce scarring, under the supervision of one of our physicians.
        - list [ref=f16e390]:
          - listitem [ref=f16e391]:
            - link [ref=f16e392] [cursor=pointer]:
              - /url: /en/aesthetics/concerns/acne-scars
              - generic [ref=f16e393]:
                - heading "Acne Scars" [level=3] [ref=f16e394]
                - paragraph [ref=f16e395]: Comprehensive care for acne scarring — medical consultations, prescriptions where necessary, and RF micro-needling and laser treatments to reduce scarring, under the supervision of one of our physicians.
          - listitem [ref=f16e399]:
            - link [ref=f16e400] [cursor=pointer]:
              - /url: /en/aesthetics/concerns/rosacea-redness
              - generic [ref=f16e401]:
                - heading "Rosacea & Redness" [level=3] [ref=f16e402]
                - paragraph [ref=f16e403]: The gentle flush of rosacea can escalate into redness that's distressing to live with. We take a holistic approach, starting with a full medical consultation to discuss what can be achieved — laser treatments often work best for this condition.
          - listitem [ref=f16e407]:
            - link [ref=f16e408] [cursor=pointer]:
              - /url: /en/aesthetics/concerns/dry-skin
              - generic [ref=f16e409]:
                - heading "Dry Skin" [level=3] [ref=f16e410]
                - paragraph [ref=f16e411]: Calgary's climate is unusually harsh on skin. Using RF micro-needling to infuse topicals — including moisturizers and pigment regulators — we help skin stay nourished and glowing for months after treatment.
          - listitem [ref=f16e415]:
            - link [ref=f16e416] [cursor=pointer]:
              - /url: /en/aesthetics/concerns/fine-lines-wrinkles
              - generic [ref=f16e417]:
                - heading "Fine Lines & Wrinkles" [level=3] [ref=f16e418]
                - paragraph [ref=f16e419]: State-of-the-art technologies to smooth and erase fine lines and wrinkles, alongside skin-tightening options for all skin types — bespoke treatments as individual as you are.
          - listitem [ref=f16e423]:
            - link [ref=f16e424] [cursor=pointer]:
              - /url: /en/aesthetics/concerns/skin-laxity
              - generic [ref=f16e425]:
                - heading "Skin Laxity" [level=3] [ref=f16e426]
                - paragraph [ref=f16e427]: Radio-frequency waves promote collagen and elastin production to tighten and smooth skin all over the body — a quick, pain-free treatment (about 15 minutes) with easy, visible results and no downtime.
          - listitem [ref=f16e431]:
            - link [ref=f16e432] [cursor=pointer]:
              - /url: /en/aesthetics/concerns/spider-veins
              - generic [ref=f16e433]:
                - heading "Spider Veins" [level=3] [ref=f16e434]
                - paragraph [ref=f16e435]: Damaged blood vessels under the skin that can appear red, blue, or purple — generally harmless but unsightly. Laser treatments can remove them from anywhere on the body quickly and painlessly.
          - listitem [ref=f16e439]:
            - link [ref=f16e440] [cursor=pointer]:
              - /url: /en/aesthetics/concerns/sun-damage-pigmentation
              - generic [ref=f16e441]:
                - heading "Sun Damage & Pigmentation" [level=3] [ref=f16e442]
                - paragraph [ref=f16e443]: Sun spots and liver spots from time in the sun can be easily reduced using our state-of-the-art laser technologies.
          - listitem [ref=f16e447]:
            - link [ref=f16e448] [cursor=pointer]:
              - /url: /en/aesthetics/concerns/skin-revitalization
              - generic [ref=f16e449]:
                - heading "Skin Revitalization" [level=3] [ref=f16e450]
                - paragraph [ref=f16e451]: Harsh weather and daily stresses can leave skin looking tired. We can refresh skin in under 45 minutes, exposing a natural glow and reducing the appearance of fine lines and wrinkles.
          - listitem [ref=f16e455]:
            - link [ref=f16e456] [cursor=pointer]:
              - /url: /en/aesthetics/concerns/razor-bumps
              - generic [ref=f16e457]:
                - heading "Razor Bumps" [level=3] [ref=f16e458]
                - paragraph [ref=f16e459]: Uncomfortable and prone to infection when combined with ingrown hairs. Our technologies can remove razor bumps, treat the underlying cause, and give you smoother, softer skin with minimally invasive treatment.
      - link "View all concerns" [ref=f16e463] [cursor=pointer]:
        - /url: /en/aesthetics/concerns
