      - paragraph [ref=f18e349]: By concern
      - heading "Explore information and treatment options" [level=2] [ref=f18e350]
      - paragraph [ref=f18e351]: Browse by what you're noticing, and see the approved treatments and technologies that may be relevant — a starting point for your consultation, not a diagnosis.
      - generic [ref=f18e352]:
        - generic [ref=f18e353]:
          - figure [ref=f18e354]:
            - img "Acne Scars — Blue Diamond Medical Aesthetics" [ref=f18e355]
          - generic [ref=f18e360]:
            - paragraph [ref=f18e361]: Acne Scars
            - paragraph [ref=f18e362]: Comprehensive care for acne scarring — medical consultations, prescriptions where necessary, and RF micro-needling and laser treatments to reduce scarring, under the supervision of one of our physicians.
        - list [ref=f18e363]:
          - listitem [ref=f18e364]:
            - link [ref=f18e365] [cursor=pointer]:
              - /url: /en/aesthetics/concerns/acne-scars
              - generic [ref=f18e366]:
                - heading "Acne Scars" [level=3] [ref=f18e367]
                - paragraph [ref=f18e368]: Comprehensive care for acne scarring — medical consultations, prescriptions where necessary, and RF micro-needling and laser treatments to reduce scarring, under the supervision of one of our physicians.
          - listitem [ref=f18e372]:
            - link [ref=f18e373] [cursor=pointer]:
              - /url: /en/aesthetics/concerns/rosacea-redness
              - generic [ref=f18e374]:
                - heading "Rosacea & Redness" [level=3] [ref=f18e375]
                - paragraph [ref=f18e376]: The gentle flush of rosacea can escalate into redness that's distressing to live with. We take a holistic approach, starting with a full medical consultation to discuss what can be achieved — laser treatments often work best for this condition.
          - listitem [ref=f18e380]:
            - link [ref=f18e381] [cursor=pointer]:
              - /url: /en/aesthetics/concerns/dry-skin
              - generic [ref=f18e382]:
                - heading "Dry Skin" [level=3] [ref=f18e383]
                - paragraph [ref=f18e384]: Calgary's climate is unusually harsh on skin. Using RF micro-needling to infuse topicals — including moisturizers and pigment regulators — we help skin stay nourished and glowing for months after treatment.
          - listitem [ref=f18e388]:
            - link [ref=f18e389] [cursor=pointer]:
              - /url: /en/aesthetics/concerns/fine-lines-wrinkles
              - generic [ref=f18e390]:
                - heading "Fine Lines & Wrinkles" [level=3] [ref=f18e391]
                - paragraph [ref=f18e392]: State-of-the-art technologies to smooth and erase fine lines and wrinkles, alongside skin-tightening options for all skin types — bespoke treatments as individual as you are.
          - listitem [ref=f18e396]:
            - link [ref=f18e397] [cursor=pointer]:
              - /url: /en/aesthetics/concerns/skin-laxity
              - generic [ref=f18e398]:
                - heading "Skin Laxity" [level=3] [ref=f18e399]
                - paragraph [ref=f18e400]: Radio-frequency waves promote collagen and elastin production to tighten and smooth skin all over the body — a quick, pain-free treatment (about 15 minutes) with easy, visible results and no downtime.
          - listitem [ref=f18e404]:
            - link [ref=f18e405] [cursor=pointer]:
              - /url: /en/aesthetics/concerns/spider-veins
              - generic [ref=f18e406]:
                - heading "Spider Veins" [level=3] [ref=f18e407]
                - paragraph [ref=f18e408]: Damaged blood vessels under the skin that can appear red, blue, or purple — generally harmless but unsightly. Laser treatments can remove them from anywhere on the body quickly and painlessly.
          - listitem [ref=f18e412]:
            - link [ref=f18e413] [cursor=pointer]:
              - /url: /en/aesthetics/concerns/sun-damage-pigmentation
              - generic [ref=f18e414]:
                - heading "Sun Damage & Pigmentation" [level=3] [ref=f18e415]
                - paragraph [ref=f18e416]: Sun spots and liver spots from time in the sun can be easily reduced using our state-of-the-art laser technologies.
          - listitem [ref=f18e420]:
            - link [ref=f18e421] [cursor=pointer]:
              - /url: /en/aesthetics/concerns/skin-revitalization
              - generic [ref=f18e422]:
                - heading "Skin Revitalization" [level=3] [ref=f18e423]
                - paragraph [ref=f18e424]: Harsh weather and daily stresses can leave skin looking tired. We can refresh skin in under 45 minutes, exposing a natural glow and reducing the appearance of fine lines and wrinkles.
          - listitem [ref=f18e428]:
            - link [ref=f18e429] [cursor=pointer]:
              - /url: /en/aesthetics/concerns/razor-bumps
              - generic [ref=f18e430]:
                - heading "Razor Bumps" [level=3] [ref=f18e431]
                - paragraph [ref=f18e432]: Uncomfortable and prone to infection when combined with ingrown hairs. Our technologies can remove razor bumps, treat the underlying cause, and give you smoother, softer skin with minimally invasive treatment.
      - link "View all concerns" [ref=f18e436] [cursor=pointer]:
